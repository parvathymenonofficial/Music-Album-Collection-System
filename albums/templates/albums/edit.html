
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Album</title>

    <link rel="stylesheet"
          href="{% static 'albums/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Edit Album</h1>

        <form method="POST"
              onsubmit="return validateAlbumForm()">

            {% csrf_token %}

            <input type="text"
                   id="album_name"
                   name="album_name"
                   value="{{ album.album_name }}"
                   placeholder="Album Name"
                   required>

            <br><br>

            <input type="text"
                   id="artist"
                   name="artist"
                   value="{{ album.artist }}"
                   placeholder="Artist"
                   required>

            <br><br>

            <input type="text"
                   id="genre"
                   name="genre"
                   value="{{ album.genre }}"
                   placeholder="Genre"
                   required>

            <br><br>

            <input type="text"
                   id="year"
                   name="year"
                   value="{{ album.year }}"
                   placeholder="Year"
                   required>

            <br><br>

            <button type="submit" class="btn">
                Update Album
            </button>

        </form>

        <br>

        <a href="{% url 'view_albums' %}" class="btn">
            Back to Albums
        </a>

    </div>

    <script src="{% static 'albums/script.js' %}"></script>

</body>
</html>

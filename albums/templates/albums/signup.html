
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <link rel="stylesheet"
          href="{% static 'albums/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn">
                Register
            </button>

        </form>

        <p>Already have an account?</p>

        <a href="{% url 'login' %}" class="btn">
            Login
        </a>

    </div>

</body>
</html>

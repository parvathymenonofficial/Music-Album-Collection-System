
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
          href="{% static 'albums/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>User Login</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            {% if form.errors %}
                <p style="color:red;">
                    Invalid username or password!
                </p>
            {% endif %}

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p>Don't have an account?</p>

        <a href="{% url 'signup' %}" class="btn">
            Sign Up
        </a>

    </div>

</body>
</html>
